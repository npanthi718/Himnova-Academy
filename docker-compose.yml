version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: himnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-himnova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-himnova_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-himnova_launchpad}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-himnova_user} -d ${POSTGRES_DB:-himnova_launchpad}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - himnova-net

  redis:
    image: redis:7-alpine
    container_name: himnova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - himnova-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: himnova-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-himnova_user}:${POSTGRES_PASSWORD:-himnova_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-himnova_launchpad}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-himnova_jwt_super_secret_production_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-himnova_jwt_refresh_secret_production_key_2026}
      CORS_ORIGIN: http://localhost:3000,https://learn.himnovatech.com
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - himnova-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: himnova-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - himnova-net

volumes:
  postgres_data:
  redis_data:

networks:
  himnova-net:
    driver: bridge
